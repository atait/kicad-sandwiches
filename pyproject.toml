[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-sandwiches"
dynamic = ["version"]
description = "Sandwich/oreo PCB board generation tool for KiCad"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alex Tait"},
]
maintainers = [
    {name = "Alex Tait"},
]
keywords = ["kicad", "pcb", "sandwich", "multi-pcb", "electronics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = [
    "kigadgets>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
gui = []

[project.urls]
Homepage = "https://github.com/atait/kicad-sandwiches"
Repository = "https://github.com/atait/kicad-sandwiches"
"Bug Reports" = "https://github.com/atait/kicad-sandwiches/issues"
Documentation = "https://github.com/atait/kicad-sandwiches/blob/main/README.md"

[project.scripts]
kisandwich = "kisandwich.__main__:main"

[tool.setuptools]
packages = ["kisandwich"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
kisandwich = ["icons/*.png", "icons/*.svg"]

[tool.setuptools_scm]
write_to = "kisandwich/_version.py"
